# http-level half of the CKAN crawler guard for the prod host's nginx (data.wprdc.org).
# Install: copy to /etc/nginx/conf.d/ (included inside http {} on Debian/Ubuntu).
# The server-level half is ckan-crawler-server.conf.
#
# Requests arrive via CloudFront, so $remote_addr is an edge IP shared by many
# viewers. CloudFront appends the real viewer IP as the LAST X-Forwarded-For entry;
# earlier entries are client-supplied and spoofable, so key on the last one.
map $http_x_forwarded_for $ckan_client_ip {
    "~(?<last_ip>[^,\s]+)\s*$"  $last_ip;
    default                     $remote_addr;
}

# Rate-limit only search listings (dataset search, org/group pages, with or without a
# locale prefix). An empty key means "not limited", so assets, API and dataset pages
# are untouched.
map $uri $ckan_search_client {
    "~^/(?:[A-Za-z_]+/)?(?:dataset/?|organization/[^/]+/?|group/[^/]+/?)$"  $ckan_client_ip;
    default                                                                   "";
}

# ~1 search page per second per viewer, with burst headroom for normal clicking.
limit_req_zone $ckan_search_client zone=ckan_search:10m rate=60r/m;
limit_req_status 429;
