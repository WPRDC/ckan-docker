# server-level half of the CKAN crawler guard; see ckan-crawler-http.conf.
# Install: copy to /etc/nginx/snippets/ and add inside the data.wprdc.org server {} of
# /etc/nginx/sites-available/ckan, above the location blocks:
#     include snippets/ckan-crawler-server.conf;
# then: sudo nginx -t && sudo systemctl reload nginx

# Bots walk faceted search by stacking filters (8-12 tags/groups/formats per URL).
# People rarely combine more than a few, so refuse 5+ before it reaches Solr.
if ($args ~* "((^|&)(tags|groups|res_format)=[^&]*){5,}") {
    return 429;
}

# Locale prefixes CKAN no longer serves (CKAN__LOCALES_FILTERED_OUT in .env.prod).
# CKAN would 404 these anyway; answering here keeps them off uWSGI entirely.
location ~ ^/(am|ar|bg|bs|ca|cs_CZ|da_DK|de|el|en_AU|en_GB|es_AR|eu|fa_IR|fi|fr|gl|gl_ES|he|hr|hu|id|is|it|ja|km|ko_KR|lt|lv|mk|mn_MN|my_MM|nb_NO|ne|ne_NP|nl|no|pl|pt_BR|pt_PT|ro|ru|sk|sl|sq|sr|sr_Latn|sv|th|tl|tr|uk|uk_UA|vi|zh_Hans_CN|zh_Hant_TW)(/|$) {
    return 404;
}

limit_req zone=ckan_search burst=20 nodelay;
