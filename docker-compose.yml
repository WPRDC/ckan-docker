volumes:
  ckan_storage:
  solr_data:
  pip_cache:
  site_packages:
  tiles_data:
  home_dir:


services:
    
  ckan:
    platform: linux/amd64
    build:
      context: ckan/
      dockerfile: Dockerfile
      args:
        - TZ=${TZ}
    networks:
      - ckannet
      - solrnet
      - redisnet
    env_file:
      - .env
    environment:
      # DataPusher+ 3.x submits its ingest flow to Prefect; CKAN needs the API to
      # create flow runs.
      - PREFECT_API_URL=http://prefect:4200/api
      # Default PREFECT_HOME ($APP_DIR/.prefect) is not writable by the `ckan` user.
      - PREFECT_HOME=/tmp/prefect
    ports:
      - "0.0.0.0:${CKAN_PORT_HOST}:5000"
    depends_on:
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - home_dir:/srv/app/
      - /data/ckan:/var/lib/ckan
      - pip_cache:/root/.cache/pip
      - site_packages:/usr/local/lib/python3.14/site-packages
    restart: unless-stopped
    healthcheck:
      # the ckan-base 2.12 image (python3.14) ships curl, not wget
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/api/action/status_show"]
      interval: 60s
      timeout: 10s
      retries: 3

  solr:
    platform: linux/amd64
    networks:
      - solrnet
    image: ckan/ckan-solr:${SOLR_IMAGE_VERSION}
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8983/solr/"]

  redis:
    image: redis:${REDIS_VERSION}
    networks:
      - redisnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]

  # Prefect API + UI for DataPusher+ 3.x, which replaced the old RQ queue with Prefect
  # deployments. Built from the CKAN image (not prefecthq/prefect) so the server can
  # never drift from the client version CKAN and the worker run. The UI is bound to
  # localhost only — tunnel in, or front it with the existing reverse proxy.
  #
  # Orchestration state lives in Postgres, not the default SQLite under PREFECT_HOME:
  # `prefect server start` runs several background writer-services and the DataPusher+
  # worker polls the pool, so concurrent writes to one SQLite file throw
  # "database is locked". Point PREFECT_DATABASE_URL at a `prefect` database on the same
  # Postgres CKAN uses (create it once: CREATE DATABASE prefect; Prefect migrates on
  # start). Still runs as root so `prefect server start` can unpack its bundled UI into
  # site-packages; PREFECT_HOME stays a writable in-container path for its profile /
  # block-registration memo (no DB there anymore), so the prefect_data volume is gone.
  prefect:
    platform: linux/amd64
    build:
      context: ckan/
      dockerfile: Dockerfile
      args:
        - TZ=${TZ}
    user: root
    networks:
      - ckannet
    environment:
      - PREFECT_SERVER_DATABASE_CONNECTION_URL=${PREFECT_DATABASE_URL}
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_HOME=/root/.prefect
      # address the browser uses for API calls when the UI is reached on the published
      # port; change it if you front the UI with a reverse proxy at another hostname
      - PREFECT_UI_API_URL=http://localhost:${PREFECT_PORT_HOST}/api
    command: prefect server start
    ports:
      - "127.0.0.1:${PREFECT_PORT_HOST}:4200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:4200/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Runs the DataPusher+ ingest flow. Must be the CKAN image, not a stock Prefect one:
  # DPP's prefect.yaml uses a `process` work pool, so the flow executes in-process and
  # needs CKAN, the DPP source tree, ckan.ini and qsvdp all present. Same networks as
  # `ckan` so the datastore / solr / redis hosts resolve identically; shares home_dir
  # with `ckan` so both read the same /srv/app/ckan.ini.
  ckan-worker:
    platform: linux/amd64
    build:
      context: ckan/
      dockerfile: Dockerfile
      args:
        - TZ=${TZ}
    networks:
      - ckannet
      - solrnet
      - redisnet
    env_file:
      - .env
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - PREFECT_HOME=/tmp/prefect
      # DPP's Prefect result-storage block defaults to ~/.prefect/datapusher-plus-results.
      # $HOME is /srv/app (not writable by `ckan`), so block registration fails silently
      # and the `with transaction():` group in prefect_flow.py can't durably commit —
      # Prefect then rolls back the datastore write even though the run logs "JOB DONE!".
      # Pointing HOME at world-writable /tmp lets the block register and the commit stick.
      - HOME=/tmp
    depends_on:
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
      prefect:
        condition: service_healthy
      # The real ordering guard. `ckan` writes /srv/app/ckan.ini (prerun + the
      # /docker-entrypoint.d scripts) BEFORE uWSGI comes up, so once it reports healthy
      # the shared ckan.ini is fully written and no longer being rewritten. Without this
      # the worker races the image's placeholder ckan.ini that home_dir seeds in on first
      # mount.
      ckan:
        condition: service_healthy
    volumes:
      - home_dir:/srv/app/
      - /data/ckan:/var/lib/ckan
      - pip_cache:/root/.cache/pip
      - site_packages:/usr/local/lib/python3.14/site-packages
    restart: unless-stopped
    # Belt-and-suspenders for the restart-policy path (depends_on only gates `up`, not a
    # later auto-restart): wait until the datapusher_plus config keys are present, which
    # only 10_datapusher_plus_prep.sh writes — the placeholder ini has none. Work-pool
    # creation and prefect-deploy are idempotent, so restarts stay clean.
    command: >
      bash -c 'until [ -s "$$CKAN_INI" ] && grep -q "^ckanext.datapusher_plus\." "$$CKAN_INI"; do
      echo "waiting for a fully-written ckan.ini..."; sleep 3; done;
      prefect work-pool create --type process datapusher-plus || true;
      cd /srv/app/src/datapusher-plus && ckan -c "$$CKAN_INI" datapusher_plus prefect-deploy;
      exec prefect worker start --pool datapusher-plus'


  tiles:
    container_name: ${MARTIN_CONTAINER_NAME}
    build:
      context: martin/
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - tiles_data:/tiles
    ports:
      - "0.0.0.0:${MARTIN_PORT_HOST}:3000"
    environment:
      - "DATABASE_URL=${CKAN_DATASTORE_READ_URL}"
      - "MAPS_DATABASE_URL=${MAPS_DATABASE_URL}"
    healthcheck:
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/catalog" ]

networks:
  ckannet:
  solrnet:
    internal: true
  redisnet:
    internal: true
