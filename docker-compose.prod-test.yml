# Extra layer for smoke-testing the production stack (docker-compose.yml) on a local
# macOS Docker Desktop. docker-compose.yml is left untouched.
#
#   docker compose -p ckan-prodtest \
#     -f docker-compose.yml -f docker-compose.prod-test.yml \
#     --env-file .env.prod-test up -d --build
#
# What this changes vs the real prod compose (which uses a managed Postgres and an
# external reverse proxy):
#   * Adds a self-contained `db` service built from postgresql/ (same initdb scripts as
#     the dev stack -- creates ckandb, datastore, maps, prefect, test DBs, dp roles).
#     Wired into ckan / ckan-worker / prefect via depends_on, and onto both ckannet and
#     the default network so `tiles` can reach it too.
#   * The `/data/ckan` host bind mount (a Linux server path that doesn't exist here and
#     isn't a Docker Desktop shared path) becomes a named volume.
#   * `.env.prod-test` is layered after `.env` as an env_file so its literal values win
#     (callback URL -> the prod `ckan` service, CKAN_SITE_URL -> :5002, DB host -> `db`,
#     PREFECT_DATABASE_URL, shifted host ports).

volumes:
  ckan_data:
  pg_data:

networks:
  default:

services:
  db:
    build:
      context: postgresql/
    platform: linux/amd64
    networks:
      - ckannet
      - default
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - CKAN_DB_USER
      - CKAN_DB_PASSWORD
      - CKAN_DB
      - DATASTORE_READONLY_USER
      - DATASTORE_READONLY_PASSWORD
      - DATASTORE_DB
    ports:
      - "0.0.0.0:${DB_PORT_HOST}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15

  ckan:
    env_file:
      - .env
      - .env.prod-test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ckan_data:/var/lib/ckan

  ckan-worker:
    env_file:
      - .env
      - .env.prod-test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ckan_data:/var/lib/ckan

  prefect:
    depends_on:
      db:
        condition: service_healthy
